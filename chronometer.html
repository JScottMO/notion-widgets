<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chronometer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root {
  color-scheme: light dark;
  --bg: #EEF0F3; --surface: #FFFFFF; --sunken: #F4F6F8;
  --ink: #171C24; --muted: #5F6A78; --faint: #8B96A4;
  --line: #DDE2E8; --brass: #9C6B12; --brass-soft: #F3EADA;
  --alert: #A33B12; --alert-soft: #F8ECE6;
  --night: #AEB8C4; --edge: #D5D9DE; --day: #F1EBDD;
  --display: "Familjen Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  --mono: "Chivo Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171C; --surface: #1C2027; --sunken: #171B21;
    --ink: #E9ECF1; --muted: #97A1AE; --faint: #6E7987;
    --line: #2C323A; --brass: #D9A441; --brass-soft: #2A2317;
    --alert: #E58F62; --alert-soft: #2E1F18;
    --night: #2B333F; --edge: #414A56; --day: #5C5442;
  }
}
:root[data-theme="dark"] {
  --bg: #14171C; --surface: #1C2027; --sunken: #171B21;
  --ink: #E9ECF1; --muted: #97A1AE; --faint: #6E7987;
  --line: #2C323A; --brass: #D9A441; --brass-soft: #2A2317;
  --alert: #E58F62; --alert-soft: #2E1F18;
  --night: #2B333F; --edge: #414A56; --day: #5C5442;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--display); line-height: 1.45; -webkit-font-smoothing: antialiased;
}
.board {
  margin: 10px; background: var(--surface);
  border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
}
:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* ---------------- clock strip ---------------- */

.strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(104px, 1fr)); }
.city { padding: 10px 7px 9px; border-left: 1px solid var(--line); min-width: 0; }
.city:first-child { border-left: 0; }
.top { display: flex; align-items: flex-start; justify-content: space-between; gap: 3px; }
.name {
  font-size: 12px; font-weight: 600; letter-spacing: -.02em; min-width: 0;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.cflag {
  flex: none; font-size: 13px; line-height: 1.1;
  font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
}
.region {
  font-size: 10px; color: var(--faint);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.time {
  font-family: var(--mono); font-variant-numeric: tabular-nums;
  font-weight: 600; font-size: clamp(1.2rem, 3vw, 1.75rem); line-height: 1;
  letter-spacing: -.035em; margin: 9px 0 0;
  display: flex; align-items: baseline; gap: 4px;
}
.tmer { font-size: 10px; font-weight: 400; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.band {
  position: relative; height: 4px; border-radius: 2px; margin: 9px 0 7px;
  background: linear-gradient(90deg,
    var(--night) 0 25%, var(--edge) 25% 37.5%, var(--day) 37.5% 75%,
    var(--edge) 75% 87.5%, var(--night) 87.5% 100%);
}
.now {
  position: absolute; top: -3px; bottom: -3px; width: 2px;
  background: var(--brass); border-radius: 1px; transform: translateX(-1px);
}
.meta {
  display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between;
  gap: 0 8px; font-size: 11px; color: var(--muted);
}
.date { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.date b { font-weight: 600; color: var(--ink); }
.off { font-family: var(--mono); font-size: 10px; color: var(--faint); white-space: nowrap; }
.phase { text-transform: lowercase; }
.bar {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 6px 12px; border-top: 1px solid var(--line);
}
.zone {
  font-family: var(--mono); font-size: 10px; letter-spacing: .1em;
  text-transform: uppercase; color: var(--faint);
}
.toggle {
  font-family: var(--mono); font-size: 10.5px; font-weight: 600; letter-spacing: .06em;
  color: var(--muted); background: transparent;
  border: 1px solid var(--line); border-radius: 5px; padding: 3px 8px; cursor: pointer;
}
.toggle:hover { color: var(--brass); border-color: var(--brass); }
@media (max-width: 360px) {
  .city { border-left: 0; border-top: 1px solid var(--line); }
  .city:first-child { border-top: 0; }
}

/* ---------------- converters ---------------- */

.ask {
  display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px 14px;
  padding: 12px 14px; border-bottom: 1px solid var(--line);
}
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field.grow { flex: 1 1 190px; }
label {
  font-family: var(--mono); font-size: 9.5px; font-weight: 600;
  letter-spacing: .13em; text-transform: uppercase; color: var(--faint);
}
.pair { display: flex; gap: 6px; }
.src { margin: 1px 0 0; font-family: var(--mono); font-size: 10px; color: var(--faint); white-space: nowrap; }
input {
  font-family: var(--display); font-size: 13px; color: var(--ink);
  background: var(--sunken); border: 1px solid var(--line);
  border-radius: 7px; padding: 7px 9px; min-width: 0; width: 100%;
}
input[type="date"] { max-width: 148px; }
input[type="time"] { max-width: 132px; }
input:focus { outline: 2px solid var(--brass); outline-offset: -1px; border-color: var(--brass); }
.arrow { color: var(--faint); font-size: 15px; padding-bottom: 22px; flex: none; }
.selwrap { position: relative; display: flex; }
.selwrap::after {
  content: ""; position: absolute; right: 10px; top: 50%;
  width: 0; height: 0; margin-top: -2px; pointer-events: none;
  border-left: 4px solid transparent; border-right: 4px solid transparent;
  border-top: 5px solid var(--muted);
}
select {
  -webkit-appearance: none; appearance: none;
  font-family: var(--display); font-size: 13px; color: var(--ink);
  background: var(--sunken); border: 1px solid var(--line);
  border-radius: 7px; padding: 7px 26px 7px 9px;
  width: 100%; min-width: 0; cursor: pointer; text-overflow: ellipsis;
}
select:focus { outline: 2px solid var(--brass); outline-offset: -1px; border-color: var(--brass); }
optgroup { font-style: normal; font-weight: 600; }
option { font-weight: 400; }
.answer {
  display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px;
  padding: 13px 14px 14px;
}
.big {
  font-family: var(--mono); font-variant-numeric: tabular-nums;
  font-weight: 600; font-size: clamp(1.8rem, 5vw, 2.4rem); line-height: 1;
  letter-spacing: -.035em; color: var(--ink);
}
.bmer { font-size: .42em; font-weight: 400; letter-spacing: .06em; color: var(--muted); margin-left: 5px; }
.where { display: flex; flex-direction: column; gap: 1px; min-width: 0; flex: 1 1 auto; }
.l1 { font-size: 13.5px; font-weight: 500; }
.l1 .day { color: var(--brass); font-weight: 600; }
.l2 { font-family: var(--mono); font-size: 10.5px; color: var(--faint); }
.aflag { font-size: 15px; font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; }
.warn {
  display: none; margin: 0 14px 13px; padding: 8px 10px;
  background: var(--alert-soft); border-left: 2px solid var(--alert);
  border-radius: 0 6px 6px 0; font-size: 11.5px; color: var(--ink);
}
.warn.on { display: block; }
.warn b { color: var(--alert); font-weight: 600; }
</style>

</head>

function partsIn(tz, when) {
  var f = new Intl.DateTimeFormat('en-US', {
    timeZone: tz, hourCycle: 'h23',
    year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', second: '2-digit', weekday: 'short'

}

function offsetMin(tz, when) {
  var p = partsIn(tz, when);
  return Math.round((Date.UTC(p.y, p.mo - 1, p.d, p.h, p.mi, p.s) - Math.floor(when.getTime() / 1000) * 1000) / 60000);
}

// Wall-clock time in `tz` -> instant. Reports gaps and ambiguity honestly.
// status: 'ok' | 'gap' (clocks skipped this time) | 'ambiguous' (it happened twice)
function resolveWallClock(tz, y, mo, d, h, mi) {
  var naive = Date.UTC(y, mo - 1, d, h, mi, 0);

  // Two candidate offsets: probe well before and well after the wall time.
  var offBefore = offsetMin(tz, new Date(naive - 86400000));
  var offAfter  = offsetMin(tz, new Date(naive + 86400000));

  var seen = [], hits = [];
  [offBefore, offAfter].forEach(function (off) {
    if (seen.indexOf(off) >= 0) { return; }
    seen.push(off);
    var ts = naive - off * 60000;
    var back = partsIn(tz, new Date(ts));
    if (back.y === y && back.mo === mo && back.d === d && back.h === h && back.mi === mi) {
      hits.push({ ts: ts, off: off });
    }
  });

  if (hits.length === 0) {
    // Spring-forward gap. Shift forward by the length of the gap, which is what
    // java.time and RFC 5545 do — the entered time lands after the jump, not before it.
    var jumpTo = naive - offBefore * 60000;
    return { status: 'gap', ts: jumpTo, skipped: Math.abs(offAfter - offBefore) };
  }
  hits.sort(function (a, b) { return a.ts - b.ts; });
  return {
    status: hits.length > 1 ? 'ambiguous' : 'ok',
    ts: hits[0].ts,                  // the earlier of the two, i.e. before the clocks go back
    alt: hits.length > 1 ? hits[1].ts : null
  };
}

function zoneAbbr(tz, when, style) {
  var p = new Intl.DateTimeFormat('en-US', { timeZone: tz, timeZoneName: style || 'short' })
    .formatToParts(when).filter(function (x) { return x.type === 'timeZoneName'; });
  var v = p.length ? p[0].value : '';
  // "GMT+5:30" just repeats the UTC offset we already print
  return /^(GMT|UTC)([+\u2212-]|$)/.test(v) ? '' : v;
}

function utcLabel(mins) {
  var s = mins < 0 ? '−' : '+', a = Math.abs(mins);
  var h = Math.floor(a / 60), m = a % 60;
  return 'UTC' + s + h + (m ? ':' + (m < 10 ? '0' : '') + m : '');
}

function relLabel(mins) {
  if (mins === 0) { return 'same clock time'; }
  var a = Math.abs(mins), h = Math.floor(a / 60), m = a % 60;
  var t = h + (m ? ':' + (m < 10 ? '0' : '') + m : '') + (h === 1 && !m ? ' hour' : ' hours');
  return t + (mins > 0 ? ' ahead' : ' behind');
}

function relPhrase(mins, name) {
  if (mins === 0) { return 'same clock time as ' + name; }
  return relLabel(mins) + (mins > 0 ? ' of ' : ' ') + name;
}


/* ---------- shared across all three views ---------- */

var HOME = 'America/Chicago';
var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

// The places Scott watches. Order here is the order they appear.
var FREQUENT = [
  ['Europe/London',    'London'],
  ['Africa/Gaborone',  'Botswana (Gaborone)'],
  ['Asia/Tashkent',    'Tashkent'],
  ['Asia/Kolkata',     'Kerala (Kolkata)'],
  ['Asia/Singapore',   'Singapore']
];

var regionName = (function () {
  try {
    var dn = new Intl.DisplayNames(['en'], { type: 'region' });
    return function (cc) { try { return dn.of(cc) || cc; } catch (e) { return cc; } };
  } catch (e) { return function (cc) { return cc; }; }
})();

function cityOf(zone) {
  var seg = zone.split('/');
  return seg[seg.length - 1].replace(/_/g, ' ');
}

function flagOf(cc) {
  if (!/^[A-Z]{2}$/.test(cc)) { return ''; }
  return String.fromCodePoint(0x1F1E6 + cc.charCodeAt(0) - 65, 0x1F1E6 + cc.charCodeAt(1) - 65);
}

var byZone = {};
ZONES.forEach(function (row) {
  byZone[row[0]] = { cc: row[1], city: cityOf(row[0]), country: regionName(row[1]),
                     label: cityOf(row[0]) + ', ' + regionName(row[1]) };
});

function clockPlain(h, mi) {
  var x = h % 12; if (x === 0) { x = 12; }
  return x + ':' + (mi < 10 ? '0' : '') + mi + ' ' + (h < 12 ? 'AM' : 'PM');
}
function stamp(p) { return p.wd + ', ' + MONTHS[p.mo - 1] + ' ' + p.d; }
function dayShift(a, b) {
  var n = Math.round((Date.UTC(b.y, b.mo - 1, b.d) - Date.UTC(a.y, a.mo - 1, a.d)) / 86400000);
  if (n === 0) { return ''; }
  if (n === 1) { return 'next day'; }
  if (n === -1) { return 'previous day'; }
  return (n > 0 ? '+' : '') + n + ' days';
}
function zoneWord(tz, when) { return zoneAbbr(tz, when) || utcLabel(offsetMin(tz, when)); }

// Grouped <select> covering every country in the IANA table.
var GROUPS = [
  ['Americas',                ['America']],
  ['Europe',                  ['Europe', 'Arctic']],
  ['Africa',                  ['Africa']],
  ['Asia',                    ['Asia']],
  ['Australia & Pacific',     ['Australia', 'Pacific']],
  ['Atlantic & Indian Ocean', ['Atlantic', 'Indian']],
  ['Antarctica',              ['Antarctica']]
];

function buildPicker(sel) {
  function add(parent, zone, text) {
    var o = document.createElement('option');
    o.value = zone; o.textContent = text;
    parent.appendChild(o);
  }
  var gFreq = document.createElement('optgroup');
  gFreq.label = 'Your places';
  FREQUENT.forEach(function (f) { if (byZone[f[0]]) { add(gFreq, f[0], f[1]); } });
  sel.appendChild(gFreq);

  GROUPS.forEach(function (g) {
    var rows = Object.keys(byZone).filter(function (z) {
      return g[1].indexOf(z.split('/')[0]) >= 0;
    }).map(function (z) { return { zone: z, c: byZone[z].country, city: byZone[z].city }; });
    if (!rows.length) { return; }
    rows.sort(function (a, b) { return a.c.localeCompare(b.c) || a.city.localeCompare(b.city); });
    var grp = document.createElement('optgroup');
    grp.label = g[0];
    rows.forEach(function (r) {
      var only = rows.filter(function (x) { return x.c === r.c; }).length === 1;
      add(grp, r.zone, only ? r.c : r.c + ' — ' + r.city);
    });
    sel.appendChild(grp);
  });
}

// Seed the date/time inputs with "now" in a given zone, rounded up to the next half hour.
function seedNow(dEl, tEl, tz) {
  var now = partsIn(tz, new Date());
  dEl.value = now.y + '-' + (now.mo < 10 ? '0' : '') + now.mo + '-' + (now.d < 10 ? '0' : '') + now.d;
  var next = Math.ceil((now.h * 60 + now.mi) / 30) * 30;
  if (next >= 1440) { next = 1380; }
  tEl.value = (Math.floor(next / 60) < 10 ? '0' : '') + Math.floor(next / 60) + ':' +
              (next % 60 < 10 ? '0' : '') + (next % 60);
}

function initClock() {
  var CITIES = [
    { name: 'Columbia',  region: 'Central Time', tz: HOME,               flag: '🇺🇸', home: true },
    { name: 'London',    region: 'United Kingdom', tz: 'Europe/London',  flag: '🇬🇧' },
    { name: 'Gaborone',  region: 'Botswana',     tz: 'Africa/Gaborone',  flag: '🇧🇼' },
    { name: 'Tashkent',  region: 'Uzbekistan',   tz: 'Asia/Tashkent',    flag: '🇺🇿' },
    { name: 'Kerala',    region: 'India',        tz: 'Asia/Kolkata',     flag: '🇮🇳' },
    { name: 'Singapore', region: 'Southeast Asia', tz: 'Asia/Singapore', flag: '🇸🇬' }
  ];

  var h12 = true;

  function phaseOf(h) {
    if (h < 5)  { return 'night'; }
    if (h < 9)  { return 'dawn'; }
    if (h < 12) { return 'morning'; }
    if (h < 17) { return 'afternoon'; }
    if (h < 21) { return 'evening'; }
    return 'night';
  }
  function signed(mins) {
    if (mins === 0) { return 'same time'; }
    var sign = mins < 0 ? '−' : '+', a = Math.abs(mins);
    var h = Math.floor(a / 60), m = a % 60;
    return sign + h + (m ? ':' + (m < 10 ? '0' : '') + m : '') + 'h';
  }

  var strip = document.getElementById('strip');
  var nodes = CITIES.map(function (c) {
    var el = document.createElement('div');
    el.className = 'city';
    el.innerHTML =
      '<div class="top"><span class="name"></span><span class="cflag" role="img"></span></div>' +
      '<div class="region"></div>' +
      '<div class="time"><span class="hm"></span><span class="tmer"></span></div>' +
      '<div class="band"><span class="now"></span></div>' +
      '<div class="meta"><span class="date"></span><span class="off"></span></div>';
    el.querySelector('.name').textContent = c.name;
    el.querySelector('.region').textContent = c.region;
    var fl = el.querySelector('.cflag');
    fl.textContent = c.flag;
    fl.setAttribute('aria-label', c.region);
    strip.appendChild(el);
    return { city: c, hm: el.querySelector('.hm'), mer: el.querySelector('.tmer'),
             now: el.querySelector('.now'), date: el.querySelector('.date'), off: el.querySelector('.off') };
  });

  var zoneEl = document.getElementById('zone');

  function render() {
    var when = new Date();
    var homeP = partsIn(HOME, when), homeOff = offsetMin(HOME, when);

    nodes.forEach(function (n) {
      var p = partsIn(n.city.tz, when);
      var hh = p.h, mer = '';
      if (h12) { mer = p.h < 12 ? 'am' : 'pm'; hh = p.h % 12; if (hh === 0) { hh = 12; } }
      n.hm.textContent = (h12 ? hh : (hh < 10 ? '0' + hh : hh)) + ':' + (p.mi < 10 ? '0' : '') + p.mi;
      n.mer.textContent = mer;
      n.now.style.left = ((p.h * 60 + p.mi) / 1440 * 100) + '%';

      var sameDay = p.y === homeP.y && p.mo === homeP.mo && p.d === homeP.d;
      n.date.innerHTML = (sameDay ? '' : '<b>' + p.wd + ' ' + p.d + '</b> · ') +
        '<span class="phase">' + phaseOf(p.h) + '</span>';
      n.off.textContent = n.city.home ? 'your time' : signed(offsetMin(n.city.tz, when) - homeOff);
    });

    zoneEl.textContent = zoneWord(HOME, when) + ' · offsets from Central';
  }

  document.getElementById('fmt').addEventListener('click', function () {
    h12 = !h12;
    this.textContent = h12 ? '24-hour' : '12-hour';
    render();
  });

  render();
  setTimeout(function () { render(); setInterval(render, 1000); }, 1000 - (Date.now() % 1000));
  document.addEventListener('visibilitychange', function () { if (!document.hidden) { render(); } });
}

/* Central -> anywhere */
function initTo() {
  var dEl = document.getElementById('d'), tEl = document.getElementById('t');
  var placeEl = document.getElementById('place');
  var bigEl = document.getElementById('big'), l1El = document.getElementById('l1');
  var l2El = document.getElementById('l2'), warnEl = document.getElementById('warn');
  var srcEl = document.getElementById('src');

  buildPicker(placeEl);

  function clock(p) {
    var h = p.h % 12; if (h === 0) { h = 12; }
    return h + ':' + (p.mi < 10 ? '0' : '') + p.mi +
      '<span class="bmer">' + (p.h < 12 ? 'AM' : 'PM') + '</span>';
  }
  function setWarn(html) {
    warnEl.innerHTML = html || '';
    warnEl.className = html ? 'warn on' : 'warn';
  }

  function convert() {
    var dv = dEl.value, tv = tEl.value;
    var tz = byZone[placeEl.value] ? placeEl.value : null;

    if (!dv || !tv) {
      bigEl.innerHTML = '&mdash;'; l1El.textContent = 'Enter a date and time';
      l2El.textContent = ''; srcEl.textContent = ''; setWarn(''); return;
    }
    if (!tz) {
      bigEl.innerHTML = '&mdash;'; l1El.textContent = 'Pick a place to convert';
      l2El.textContent = ''; srcEl.textContent = ''; setWarn(''); return;
    }

    var dp = dv.split('-'), tp = tv.split(':');
    var y = +dp[0], mo = +dp[1], d = +dp[2], h = +tp[0], mi = +tp[1];

    var r = resolveWallClock(HOME, y, mo, d, h, mi);
    var when = new Date(r.ts);
    var src = partsIn(HOME, when), dst = partsIn(tz, when);
    var info = byZone[tz];
    var rel = offsetMin(tz, when) - offsetMin(HOME, when);

    bigEl.innerHTML = clock(dst);
    var shift = dayShift(src, dst);
    l1El.innerHTML = '<span class="aflag">' + flagOf(info.cc) + '</span> ' + info.label +
      ' &middot; ' + stamp(dst) + (shift ? ' <span class="day">' + shift + '</span>' : '');
    l2El.textContent = [zoneAbbr(tz, when, 'long'), utcLabel(offsetMin(tz, when)),
                        relPhrase(rel, 'Central')].filter(Boolean).join('  ·  ');
    srcEl.textContent = clockPlain(src.h, src.mi) + ' ' + zoneWord(HOME, when) + ' · ' + stamp(src);

    if (r.status === 'gap') {
      setWarn('<b>That time doesn’t exist.</b>&nbsp;Central clocks jump forward ' +
        (r.skipped / 60) + ' hour' + (r.skipped === 60 ? '' : 's') + ' on ' + stamp(src) +
        ', so ' + clockPlain(h, mi) + ' is skipped. Showing ' + clockPlain(src.h, src.mi) +
        ' ' + zoneWord(HOME, when) + ' instead.');
    } else if (r.status === 'ambiguous') {
      var ap = partsIn(tz, new Date(r.alt));
      setWarn('<b>That time happens twice.</b>&nbsp;Central clocks fall back on ' + stamp(src) +
        '. Showing the first pass (' + zoneWord(HOME, when) + '); the second would be ' +
        clockPlain(ap.h, ap.mi) + ' there.');
    } else { setWarn(''); }
  }

  [dEl, tEl].forEach(function (el) { el.addEventListener('input', convert); });
  placeEl.addEventListener('change', convert);
  seedNow(dEl, tEl, HOME);
  placeEl.value = 'Europe/London';
  convert();
}

/* anywhere -> Central */
function initFrom() {
  var HOME_LABEL = 'Columbia, Central Time', HOME_FLAG = '🇺🇸';
  var dEl = document.getElementById('d'), tEl = document.getElementById('t');
  var placeEl = document.getElementById('place');
  var bigEl = document.getElementById('big'), l1El = document.getElementById('l1');
  var l2El = document.getElementById('l2'), warnEl = document.getElementById('warn');
  var srcEl = document.getElementById('src'), relEl = document.getElementById('rel');

  buildPicker(placeEl);

  function clock(p) {
    var h = p.h % 12; if (h === 0) { h = 12; }
    return h + ':' + (p.mi < 10 ? '0' : '') + p.mi +
      '<span class="bmer">' + (p.h < 12 ? 'AM' : 'PM') + '</span>';
  }
  function setWarn(html) {
    warnEl.innerHTML = html || '';
    warnEl.className = html ? 'warn on' : 'warn';
  }

  function convert() {
    var dv = dEl.value, tv = tEl.value;
    var tz = byZone[placeEl.value] ? placeEl.value : null;

    if (!dv || !tv) {
      bigEl.innerHTML = '&mdash;'; l1El.textContent = 'Enter a date and time';
      l2El.textContent = ''; srcEl.textContent = ''; relEl.textContent = ''; setWarn(''); return;
    }
    if (!tz) {
      bigEl.innerHTML = '&mdash;'; l1El.textContent = 'Pick a place to convert from';
      l2El.textContent = ''; srcEl.textContent = ''; relEl.textContent = ''; setWarn(''); return;
    }

    var dp = dv.split('-'), tp = tv.split(':');
    var y = +dp[0], mo = +dp[1], d = +dp[2], h = +tp[0], mi = +tp[1];

    var r = resolveWallClock(tz, y, mo, d, h, mi);
    var when = new Date(r.ts);
    var there = partsIn(tz, when), here = partsIn(HOME, when);
    var info = byZone[tz];
    var rel = offsetMin(HOME, when) - offsetMin(tz, when);

    bigEl.innerHTML = clock(here);
    var shift = dayShift(there, here);
    l1El.innerHTML = '<span class="aflag">' + HOME_FLAG + '</span> ' + HOME_LABEL +
      ' &middot; ' + stamp(here) + (shift ? ' <span class="day">' + shift + '</span>' : '');
    l2El.textContent = [zoneAbbr(HOME, when, 'long'), utcLabel(offsetMin(HOME, when)),
                        relPhrase(rel, info.city)].filter(Boolean).join('  ·  ');
    srcEl.textContent = clockPlain(there.h, there.mi) + ' ' + zoneWord(tz, when) + ' · ' + stamp(there);
    relEl.innerHTML = '<span class="aflag">' + flagOf(info.cc) + '</span> ' + info.label;

    if (r.status === 'gap') {
      setWarn('<b>That time doesn’t exist there.</b>&nbsp;Clocks in ' + info.city +
        ' jump forward ' + (r.skipped / 60) + ' hour' + (r.skipped === 60 ? '' : 's') +
        ' on ' + stamp(there) + ', so ' + clockPlain(h, mi) + ' is skipped. Showing ' +
        clockPlain(there.h, there.mi) + ' ' + zoneWord(tz, when) + ' instead.');
    } else if (r.status === 'ambiguous') {
      var altHere = partsIn(HOME, new Date(r.alt));
      setWarn('<b>That time happens twice there.</b>&nbsp;Clocks in ' + info.city +
        ' fall back on ' + stamp(there) + '. Showing the first pass (' + zoneWord(tz, when) +
        '); the second would be ' + clockPlain(altHere.h, altHere.mi) + ' in Columbia.');
    } else { setWarn(''); }
  }

  [dEl, tEl].forEach(function (el) { el.addEventListener('input', convert); });
  placeEl.addEventListener('change', convert);
  placeEl.value = 'Europe/London';
  seedNow(dEl, tEl, 'Europe/London');
  convert();
}

(function () {
  var q = (new URLSearchParams(location.search).get('view') || 'clock').toLowerCase();
  var alias = { clock: 'clock', world: 'clock', to: 'to', out: 'to', from: 'from', in: 'from' };
  var view = alias[q] || 'clock';
  document.getElementById('root').innerHTML = VIEWS[view];
  if (view === 'to') { initTo(); }
  else if (view === 'from') { initFrom(); }
  else { initClock(); }
})();

</script>
